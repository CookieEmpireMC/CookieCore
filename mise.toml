# Same pins as CookieClicker (Paper 26.x: Java 25).
[tools]
java = "temurin-25"
maven = "3.9"
python = "3.12"

[tasks.build]
description = "Compile, test and package the plugin jar"
run = "mvn -B package"

[tasks.test]
description = "Run unit tests"
run = "mvn -B test"

[tasks.check]
description = "Full clean build, as the tester runs it (CI runs this)"
run = "mvn -B clean verify"

[tasks.team]
description = "Show commits per team member (agent identities)"
run = "git shortlog -sn --all"

[tasks.ownership-check]
description = "Check every commit on <branch> against .claude/ownership.json: mise run ownership-check <branch> [--base <feature-branch>]"
run = "python tools/ownership/check.py"
