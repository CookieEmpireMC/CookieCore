# CookieCore - main config.
# All player-facing text is in messages.yml (MiniMessage), sounds in sounds.yml.
# Apply changes with /cookiecore reload (except database.*: restart the server).

server:
  # Shown in /cookiecore version and as <server> in the sidebar
  name: "Cookie Empire"

scoreboard:
  # The sidebar for every player; its lines are in scoreboard.yml. Players can hide it with /scoreboard toggle.
  enabled: true

database:
  # h2 (embedded file, no setup) or mariadb
  type: h2
  # Prefix for every table (letters, digits, _). Lets Core share a MariaDB database with other plugins.
  table-prefix: core_
  # --- h2 ---
  # Relative to plugins/CookieCore/ (H2 adds .mv.db)
  file: data/core
  # --- mariadb ---
  host: localhost
  port: 3306
  name: cookiecore
  user: cookiecore
  password: ""
