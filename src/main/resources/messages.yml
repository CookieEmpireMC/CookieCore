# CookieCore messages (MiniMessage: https://docs.advntr.dev/minimessage/format.html).
# Placeholders are written <like_this> and are filled in by the plugin; names typed by players are never parsed as MiniMessage.
# <prefix> is the value of "prefix" below. Apply changes with /cookiecore reload.

prefix: "<gold>Cookie<yellow>Core</yellow> <dark_gray>»</dark_gray></gold> "

command:
  usage: "<prefix><gray>Usage: <white>/cookiecore [version|reload]</white></gray>"
  no-permission: "<prefix><red>You do not have permission to do that.</red>"
  unknown-player: "<prefix><red>No player named <white><name></white> has joined this server before.</red>"
  invalid-duration: "<red>'<input>' is not a duration. Use something like 30m, 12h, 7d or 1d12h.</red>"
  reloaded: "<prefix><green>Configuration reloaded.</green>"
  reload-failed: "<prefix><red>Reload finished with <white><count></white> problem(s); the previous values were kept where needed:</red>"
  reload-problem: "<dark_gray> - </dark_gray><red><problem></red>"
  version: "<prefix><gray>CookieCore <white><version></white> on <white><server></white> <dark_gray>(database: <database>, <storage>)</dark_gray></gray>"
  storage-up: "<green>connected</green>"
  storage-down: "<red>memory only</red>"

scoreboard:
  shown: "<prefix><green>Sidebar shown.</green>"
  hidden: "<prefix><gray>Sidebar hidden. Use <white>/scoreboard toggle</white> to bring it back.</gray>"
  disabled: "<prefix><red>The sidebar is turned off on this server.</red>"
  players-only: "<prefix><red>Only players have a sidebar.</red>"

gamemode:
  usage: "<prefix><gray>Usage: <white>/gamemode (survival|creative|adventure|spectator) [player]</white> <dark_gray>(also 0-3, s, c, a, sp; or /gms /gmc /gma /gmsp)</dark_gray></gray>"
  mode:
    survival: "<yellow>Survival</yellow>"
    creative: "<yellow>Creative</yellow>"
    adventure: "<yellow>Adventure</yellow>"
    spectator: "<yellow>Spectator</yellow>"
  invalid-mode: "<red>'<input>' is not a game mode. Use survival, creative, adventure or spectator (or 0-3, s, c, a, sp).</red>"
  console-needs-target: "<prefix><red>The console has no game mode. Name a player, for example <white>/gamemode creative Steve</white>.</red>"
  no-target: "<prefix><red>That player is not online.</red>"
  no-permission-others: "<prefix><red>You do not have permission to change the game mode of other players.</red>"
  no-permission-mode: "<prefix><red>You do not have permission to use <mode> mode.</red>"
  changed-self: "<prefix><green>Your game mode is now <mode>.</green>"
  changed-other: "<prefix><green><white><player></white> is now in <mode> mode.</green>"
  changed-by: "<prefix><gray><white><staff></white> set your game mode to <mode>.</gray>"
  already-self: "<prefix><gray>You are already in <mode> mode.</gray>"
  already-other: "<prefix><gray><white><player></white> is already in <mode> mode.</gray>"
  failed: "<prefix><red>Could not change the game mode of <white><player></white>; another plugin stopped it.</red>"

fly:
  console-needs-target: "<prefix><red>The console cannot fly. Name a player, for example <white>/fly Steve</white>.</red>"
  no-target: "<prefix><red>That player is not online.</red>"
  no-permission-others: "<prefix><red>You do not have permission to change flight for other players.</red>"
  enabled-self: "<prefix><green>Flight enabled.</green>"
  disabled-self: "<prefix><green>Flight disabled.</green>"
  enabled-other: "<prefix><green>Flight enabled for <white><player></white>.</green>"
  disabled-other: "<prefix><green>Flight disabled for <white><player></white>.</green>"
  enabled-by: "<prefix><gray><white><staff></white> enabled your flight.</gray>"
  disabled-by: "<prefix><gray><white><staff></white> disabled your flight.</gray>"
  already-flies-self: "<prefix><gray>You can already fly in <mode> mode.</gray>"
  already-flies-other: "<prefix><gray><white><player></white> can already fly in <mode> mode.</gray>"

speed:
  usage: "<prefix><gray>Usage: <white>/speed (1-10|reset) [walk|fly] [player]</white> <dark_gray>(1 is normal, 10 is the fastest)</dark_gray></gray>"
  invalid-level: "<prefix><red>'<input>' is not a speed. Use a whole number from 1 to 10, or reset.</red>"
  console-needs-target: "<prefix><red>The console has no speed. Name a player, for example <white>/speed 5 Steve</white>.</red>"
  no-target: "<prefix><red>That player is not online.</red>"
  no-permission-others: "<prefix><red>You do not have permission to change the speed of other players.</red>"
  type:
    walk: "walking"
    fly: "flying"
  set-self: "<prefix><green>Your <type> speed is now <white><level></white>.</green>"
  set-other: "<prefix><green>The <type> speed of <white><player></white> is now <white><level></white>.</green>"
  set-by: "<prefix><gray><white><staff></white> set your <type> speed to <white><level></white>.</gray>"
  reset-self: "<prefix><green>Your <type> speed is back to normal.</green>"
  reset-other: "<prefix><green>The <type> speed of <white><player></white> is back to normal.</green>"
  reset-by: "<prefix><gray><white><staff></white> reset your <type> speed.</gray>"

# Kicks, bans, mutes and their undo. Placeholders: <remaining> (muted-chat), <staff> (who did it), <player> (the target), <reason>, <duration> and <until>
# (tempbans), <id> and <remaining> (ban screen). Reasons and names are inserted as plain text, never parsed.
moderation:
  console: "Console"
  default-reason: "No reason given"
  starting: "<red><bold>The server is starting up</bold></red><newline><newline><gray>Please try again in a moment.</gray>"
  screen:
    kick: "<red><bold>You were kicked</bold></red><newline><newline><gray>By: <white><staff></white></gray><newline><gray>Reason: <white><reason></white></gray>"
    ban: "<red><bold>You are banned from this server</bold></red><newline><newline><gray>By: <white><staff></white></gray><newline><gray>Reason: <white><reason></white></gray><newline><newline><dark_gray>Ban ID: #<id></dark_gray>"
    tempban: "<red><bold>You are temporarily banned from this server</bold></red><newline><newline><gray>By: <white><staff></white></gray><newline><gray>Reason: <white><reason></white></gray><newline><newline><gray>Time left: <white><remaining></white></gray><newline><gray>Ends: <white><until></white></gray><newline><newline><dark_gray>Ban ID: #<id></dark_gray>"
  usage:
    kick: "<prefix><gray>Usage: <white>/kick (player) [-s] [reason]</white> <dark_gray>(-s keeps it from the public; a reason cannot start with the bare word -s)</dark_gray></gray>"
    ban: "<prefix><gray>Usage: <white>/ban (player) [-s] [reason]</white> <dark_gray>(-s keeps it from the public; a reason cannot start with the bare word -s)</dark_gray></gray>"
    tempban: "<prefix><gray>Usage: <white>/tempban (player) (duration) [-s] [reason]</white> <dark_gray>(for example 7d12h; a reason cannot start with the bare word -s)</dark_gray></gray>"
    unban: "<prefix><gray>Usage: <white>/unban (player) [-s] [reason]</white> <dark_gray>(also /pardon; a reason cannot start with the bare word -s)</dark_gray></gray>"
    mute: "<prefix><gray>Usage: <white>/mute (player) [-s] [reason]</white> <dark_gray>(-s keeps it from the public; a reason cannot start with the bare word -s)</dark_gray></gray>"
    tempmute: "<prefix><gray>Usage: <white>/tempmute (player) (duration) [-s] [reason]</white> <dark_gray>(for example 2h30m; a reason cannot start with the bare word -s)</dark_gray></gray>"
    unmute: "<prefix><gray>Usage: <white>/unmute (player) [-s] [reason]</white> <dark_gray>(a reason cannot start with the bare word -s)</dark_gray></gray>"
    warn: "<prefix><gray>Usage: <white>/warn (player) [-s] [reason]</white> <dark_gray>(-s keeps it from the public; a reason cannot start with the bare word -s)</dark_gray></gray>"
    history: "<prefix><gray>Usage: <white>/history (player) [page]</white></gray>"
  muted-chat: "<prefix><red>You are muted for <white><remaining></white>.</red> <gray>Reason: <white><reason></white></gray>"
  muted-chat-permanent: "<prefix><red>You are muted <white>permanently</white>.</red> <gray>Reason: <white><reason></white></gray>"
  already-muted: "<prefix><red><white><player></white> is already muted. Use /unmute first.</red>"
  not-muted: "<prefix><red><white><player></white> is not muted.</red>"
  mute-done: "<prefix><green>Muted <white><player></white>: <reason></green>"
  mute-temp-done: "<prefix><green>Muted <white><player></white> for <white><duration></white> (until <until>): <reason></green>"
  unmute-done: "<prefix><green>Unmuted <white><player></white>.</green>"
  mute-broadcast: "<prefix><white><player></white> <gray>was muted by</gray> <white><staff></white><gray>: <reason></gray>"
  mute-temp-broadcast: "<prefix><white><player></white> <gray>was muted for <white><duration></white> by</gray> <white><staff></white><gray>: <reason></gray>"
  unmute-broadcast: "<prefix><white><player></white> <gray>was unmuted by</gray> <white><staff></white><gray>.</gray>"
  muted-command: "<prefix><red>You are muted, so you cannot use that command.</red>"
  warn-received: "<prefix><gold><bold>You have been warned</bold></gold> <gray>by <white><staff></white>:</gray> <white><reason></white>"
  warn-done: "<prefix><green>Warned <white><player></white>: <reason></green>"
  warn-broadcast: "<prefix><white><player></white> <gray>was warned by</gray> <white><staff></white><gray>: <reason></gray>"
  history-header: "<prefix><gray>Punishments of <white><player></white> <dark_gray>(page <page>)</dark_gray></gray>"
  history-entry: "<dark_gray>#<id></dark_gray> <type> <status> <gray><date> by <white><staff></white>: <reason></gray>"
  history-entry-temp: "<dark_gray>#<id></dark_gray> <type> <status> <gray><date> for <white><length></white> by <white><staff></white>: <reason></gray>"
  history-more: "<prefix><gray>More: <white>/history <player> <next></white></gray>"
  history-empty: "<prefix><gray><white><player></white> has no punishment history.</gray>"
  history-type:
    kick: "<red>KICK</red>"
    ban: "<dark_red>BAN</dark_red>"
    tempban: "<red>TEMPBAN</red>"
    mute: "<dark_purple>MUTE</dark_purple>"
    tempmute: "<light_purple>TEMPMUTE</light_purple>"
    warn: "<gold>WARN</gold>"
  history-status:
    active: "<green>[active]</green>"
    expired: "<gray>[expired]</gray>"
    lifted: "<gray>[lifted]</gray>"
    one-off: "<dark_gray>[one-off]</dark_gray>"
  kicked: "<prefix><green>Kicked <white><player></white>: <reason></green>"
  banned: "<prefix><green>Banned <white><player></white>: <reason></green>"
  tempbanned: "<prefix><green>Banned <white><player></white> for <white><duration></white> (until <until>): <reason></green>"
  unbanned: "<prefix><green>Unbanned <white><player></white>.</green>"
  broadcast:
    kick: "<prefix><white><player></white> <gray>was kicked by</gray> <white><staff></white><gray>: <reason></gray>"
    ban: "<prefix><white><player></white> <gray>was banned by</gray> <white><staff></white><gray>: <reason></gray>"
    tempban: "<prefix><white><player></white> <gray>was banned for <white><duration></white> by</gray> <white><staff></white><gray>: <reason></gray>"
    unban: "<prefix><white><player></white> <gray>was unbanned by</gray> <white><staff></white><gray>.</gray>"
  alert:
    silent: "<dark_gray>[silent]</dark_gray> <message>"
  error:
    self: "<prefix><red>You cannot do that to yourself.</red>"
    already-banned: "<prefix><red><white><player></white> is already banned permanently.</red>"
    already-banned-until: "<prefix><red><white><player></white> is already banned until <white><until></white>.</red>"
    not-banned: "<prefix><red><white><player></white> is not banned.</red>"
    not-online: "<prefix><red>That player is not online.</red>"
    reason-too-long: "<prefix><red>That reason is too long. Use at most <white><count></white> characters.</red>"
    storage-down: "<prefix><red>The database is not available, so bans cannot be saved. Nothing was changed.</red>"
    failed: "<prefix><red>The action could not be saved to the database, so nothing was changed. See the console.</red>"
    busy: "<prefix><red>Another action on <white><player></white> is still being saved. Try again in a moment.</red>"
