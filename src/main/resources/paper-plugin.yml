name: CookieCore
version: '${version}'
main: dev.casperrs.cookieCore.CookieCore
# Downloads the JDBC drivers (cookiecore-libraries.properties) through Paper's Maven Central mirror
loader: dev.casperrs.cookieCore.CookieCoreLoader
api-version: '26.3'
load: POSTWORLD
description: Cookie Empire core - the server's base layer (tab, scoreboard, gamemode, moderation).

dependencies:
  server:
    # Optional: ranks and prefixes. Core boots and works without it.
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

# Keep in sync with dev.casperrs.cookieCore.Perm
permissions:
  cookiecore.admin.version:
    description: Use /cookiecore version.
    default: op
  cookiecore.admin.reload:
    description: Use /cookiecore reload.
    default: op
  cookiecore.admin.*:
    description: Every CookieCore admin permission.
    default: op
    children:
      cookiecore.admin.version: true
      cookiecore.admin.reload: true
