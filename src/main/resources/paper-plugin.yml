name: CookieCore
version: '${version}'
main: dev.casperrs.cookieCore.CookieCore
# Downloads the JDBC drivers (cookiecore-libraries.properties) through Paper's Maven Central mirror
loader: dev.casperrs.cookieCore.CookieCoreLoader
api-version: '26.3'
load: POSTWORLD
description: Cookie Empire core - the server's base layer (scoreboard, gamemode, moderation, chat and join lines).

dependencies:
  server:
    # Optional: ranks and prefixes. Core boots and works without it.
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

# Keep in sync with dev.casperrs.cookieCore.Perm
permissions:
  cookiecore.admin.version:
    description: Use /cookiecore version.
    default: op
  cookiecore.admin.reload:
    description: Use /cookiecore reload.
    default: op
  cookiecore.scoreboard.toggle:
    description: Use /scoreboard toggle to hide or show your sidebar.
    default: true
  cookiecore.admin.*:
    description: Every CookieCore admin permission.
    default: op
    children:
      cookiecore.admin.version: true
      cookiecore.admin.reload: true
  cookiecore.gamemode.survival:
    description: Switch yourself to survival with /gamemode.
    default: op
  cookiecore.gamemode.creative:
    description: Switch yourself to creative with /gamemode.
    default: op
  cookiecore.gamemode.adventure:
    description: Switch yourself to adventure with /gamemode.
    default: op
  cookiecore.gamemode.spectator:
    description: Switch yourself to spectator with /gamemode.
    default: op
  cookiecore.gamemode.others:
    description: Change the game mode of other players (also needs the node of that mode).
    default: op
  cookiecore.gamemode.*:
    description: Every CookieCore game mode permission.
    default: op
    children:
      cookiecore.gamemode.survival: true
      cookiecore.gamemode.creative: true
      cookiecore.gamemode.adventure: true
      cookiecore.gamemode.spectator: true
      cookiecore.gamemode.others: true
  cookiecore.fly:
    description: Use /fly on yourself.
    default: op
  cookiecore.fly.others:
    description: Use /fly on other players.
    default: op
  cookiecore.speed:
    description: Use /speed on yourself.
    default: op
  cookiecore.speed.others:
    description: Use /speed on other players.
    default: op
  cookiecore.staff.kick:
    description: Use /kick.
    default: op
  cookiecore.staff.ban:
    description: Use /ban and /tempban.
    default: op
  cookiecore.staff.unban:
    description: Use /unban (also /pardon).
    default: op
  cookiecore.staff.mute:
    description: Use /mute and /tempmute.
    default: op
  cookiecore.staff.unmute:
    description: Use /unmute.
    default: op
  cookiecore.staff.warn:
    description: Use /warn.
    default: op
  cookiecore.staff.history:
    description: Use /history.
    default: op
  cookiecore.staff.notify:
    description: See the alerts of silent (-s) kicks, bans, mutes and their undo.
    default: op
  cookiecore.staff.chat:
    description: Read and write in the staff channel (/sc).
    default: op
  cookiecore.chat.silentjoin:
    description: Join and quit without a message.
    default: false
  cookiecore.chat.msg:
    description: Send private messages with /msg and /r.
    default: true
  cookiecore.staff.*:
    description: Every CookieCore staff permission.
    default: op
    children:
      cookiecore.staff.kick: true
      cookiecore.staff.ban: true
      cookiecore.staff.unban: true
      cookiecore.staff.mute: true
      cookiecore.staff.unmute: true
      cookiecore.staff.warn: true
      cookiecore.staff.history: true
      cookiecore.staff.notify: true
      cookiecore.staff.chat: true
