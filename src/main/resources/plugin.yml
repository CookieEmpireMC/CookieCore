name: CookieCore
version: '${version}'

main: dev.casperrs.cookieCore.CookieCore
api-version: '26.3'
load: POSTWORLD
description: Cookie Empire core - the server's base layer (tab, scoreboard, gamemode, moderation).

# Optional: ranks and prefixes (a later phase). Core boots and works without it.
softdepend: [LuckPerms]

# JDBC drivers, downloaded by Paper from Maven Central (no shading needed).
# Versions must match the h2.version / mariadb.version properties in pom.xml.
libraries:
  - com.h2database:h2:${h2.version}
  - org.mariadb.jdbc:mariadb-java-client:${mariadb.version}

# Keep in sync with dev.casperrs.cookieCore.Perm
permissions:
  cookiecore.admin.version:
    description: Use /cookiecore version.
    default: op
  cookiecore.admin.reload:
    description: Use /cookiecore reload.
    default: op
  cookiecore.admin.*:
    description: Every CookieCore admin permission.
    default: op
    children:
      cookiecore.admin.version: true
      cookiecore.admin.reload: true
