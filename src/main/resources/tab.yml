# CookieCore tab list (MiniMessage: https://docs.advntr.dev/minimessage/format.html).
# Apply changes with /cookiecore reload. Turn the tab list off with tab.enabled in config.yml.
#
# header and footer: one entry per line, top to bottom; "" is a blank line. Keep lines short (about 40 characters): the
# client cuts what does not fit the screen.
# Placeholders: <player> <server> <online> <max> <ping> <tps> <rank_prefix>, plus any a plugin registers
# (the same ones as in scoreboard.yml). Values are inserted as plain text, never read as MiniMessage.
# <ping> is in milliseconds and <tps> is the server's one-minute average, at most 20.0.
#
# The order of the names follows the rank: the LuckPerms group weight when LuckPerms runs, else the order of "ranks" in
# chat.yml (the first one is listed first); everybody else follows in alphabetical order. A changed rank shows after the
# player's next join or /cookiecore reload.

header:
  - "<gold><bold><server></bold></gold>"
  - "<gray>an idle clicker you play in the world</gray>"
  - ""

footer:
  - ""
  - "<gray>Ping <white><ping>ms</white> <dark_gray>|</dark_gray> TPS <white><tps></white> <dark_gray>|</dark_gray> Online <white><online></white><dark_gray>/</dark_gray><white><max></white></gray>"

# One name in the list. <rank_prefix> is the rank's prefix from chat.yml or LuckPerms (empty without a rank).
name-format: "<rank_prefix><player>"
